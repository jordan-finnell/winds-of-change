# On a version tag (v0.1.0, ...): test, build the wheel and sdist, publish them to PyPI, and
# attach them to a GitHub Release. PyPI uses trusted publishing (OIDC), so there is no token:
# PyPI accepts uploads only from this workflow in the `pypi` environment, which only `v*` tags
# can deploy to.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/winds-of-change/
    permissions:
      contents: write # create the release
      id-token: write # trusted publishing to PyPI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv build
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --notes-file CHANGELOG.md --verify-tag
