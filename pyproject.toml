[project]
name = "winds-of-change"
version = "0.2.0"
description = "Weather-change features (pressure, humidity, temperature) for relating weather to personal health logs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.1.1",
]

[project.scripts]
woc = "winds_of_change.cli:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["winds_of_change"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
